[project]
name = "mallm"
version = "0.1.0"
description = "Mathematical large language model from scratch"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "pydantic-settings[yaml]>=2.15.0",
    "typing>=3.10.0.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "RUF", # ruff-specific
    "BLE", # flake8-blind-except: запрещает except Exception без уважительной причины
    "ANN", # flake8-annotations
]
ignore = [
    "RUF001", # кириллические строки — ложные срабатывания
    "RUF002", # кириллические docstring — ложные срабатывания
    "RUF003", # кириллические комментарии — ложные срабатывания
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = "dynamic"
